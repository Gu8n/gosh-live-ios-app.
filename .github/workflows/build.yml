
name: Build Gosh Live IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project GoshLive.xcodeproj \
            -scheme GoshLive \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GoshLive.app Payload/
          zip -r GoshLive.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GoshLive-IPA
          path: GoshLive.ipa

